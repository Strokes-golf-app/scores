<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img">
<defs><filter id="sticker" x="-30%" y="-30%" width="160%" height="160%">
  <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="dil"/>
  <feFlood flood-color="#FFFFFF" result="wht"/>
  <feComposite in="wht" in2="dil" operator="in" result="brd"/>
  <feMerge result="art"><feMergeNode in="brd"/><feMergeNode in="SourceGraphic"/></feMerge>
  <feDropShadow in="art" dx="0" dy="2" stdDeviation="1.8" flood-color="#0F231B" flood-opacity="0.22"/>
</filter></defs>
<g filter="url(#sticker)">
  <g transform="rotate(-6 64 64)">
    <!-- card -->
    <rect x="28" y="18" width="72" height="92" rx="9" fill="#F5ECD9" stroke="#DCC99B" stroke-width="2"/>
    <!-- header -->
    <path d="M28,27 Q28,18 37,18 L91,18 Q100,18 100,27 L100,38 L28,38 Z" fill="#1F4D3D"/>
    <!-- header flag glyph -->
    <rect x="37" y="24" width="1.6" height="10" fill="#F5ECD9"/>
    <path d="M38.6,24 L45,26.4 L38.6,28.8 Z" fill="#B5402F"/>
    <!-- header title bar -->
    <rect x="50" y="26.5" width="34" height="3" rx="1.5" fill="#F5ECD9" opacity="0.85"/>
    <!-- grid: horizontals -->
    <g stroke="#D8C598" stroke-width="1.4">
      <line x1="34" y1="50" x2="94" y2="50"/>
      <line x1="34" y1="62" x2="94" y2="62"/>
      <line x1="34" y1="74" x2="94" y2="74"/>
      <line x1="34" y1="86" x2="94" y2="86"/>
      <line x1="34" y1="98" x2="94" y2="98"/>
      <line x1="52" y1="42" x2="52" y2="104"/>
      <line x1="70" y1="42" x2="70" y2="104"/>
      <line x1="88" y1="42" x2="88" y2="104"/>
    </g>
    <!-- row labels (players) -->
    <g fill="#9A8F77" opacity="0.75">
      <rect x="37" y="44" width="11" height="2.4" rx="1.2"/>
      <rect x="37" y="56" width="11" height="2.4" rx="1.2"/>
      <rect x="37" y="68" width="11" height="2.4" rx="1.2"/>
      <rect x="37" y="80" width="11" height="2.4" rx="1.2"/>
    </g>
    <!-- filled scores -->
    <circle cx="61" cy="56" r="4" fill="none" stroke="#2E6B54" stroke-width="2"/>
    <circle cx="79" cy="56" r="1.7" fill="#3A3A3A"/>
    <path d="M59,67 l4,4 M63,67 l-4,4" stroke="#3A3A3A" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="79" cy="80" r="1.7" fill="#3A3A3A"/>
  </g>
  <!-- pencil resting across the card -->
  <g transform="rotate(-27 62 96)">
    <rect x="20" y="90" width="8" height="12" rx="3" fill="#E79AA0"/>
    <rect x="28" y="90" width="5" height="12" fill="#C9CDCE"/>
    <rect x="33" y="90" width="59" height="12" fill="#E8B84B"/>
    <rect x="33" y="90" width="59" height="3" fill="#F2CE77"/>
    <rect x="33" y="98.5" width="59" height="3.5" fill="#C9922E"/>
    <path d="M92,90 L102,96 L92,102 Z" fill="#E7C79B"/>
    <path d="M99.4,93.8 L102,96 L99.4,98.2 Z" fill="#3A3A3A"/>
  </g>

</g>
</svg>
